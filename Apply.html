<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply | Hot Beans Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="Favicon.ico" alt="Hot Beans Logo" class="logo-img">
            <h1 class="logo-text">Hot Beans Web</h1>
        </div>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="Trainees.html">Trainees</a>
            <a href="Jobs.html">Jobs</a>
            <a href="Courses.html">Courses</a>
            <a href="Apply.html" class="active">Apply</a>
        </nav>
    </header>

    <main class="container">
        <section class="page-title centered">
            <h1 class="mega-title">Apply Now.</h1>
            <p class="hero-subtext">Take the next step in your career. Fill out the form below and our team will be in touch.</p>
        </section>

        <section class="form-container">
            <form action="#" method="POST" class="apply-form">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="full-name">Full Name</label>
                        <input type="text" id="full-name" name="name" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="john@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="interest">Applying For:</label>
                        <select id="interest" name="interest" required>
                            <option value="" disabled selected>Select an option</option>
                            <optgroup label="Software Jobs">
                                <option value="jr-frontend">Junior Frontend Developer</option>
                                <option value="full-stack">Full-Stack Engineer</option>
                                <option value="backend">Backend Specialist</option>
                                <option value="devops">DevOps Engineer</option>
                            </optgroup>
                            <optgroup label="Courses & Training">
                                <option value="trainee-program">Trainee Program (General)</option>
                                <option value="web-fundamentals">Web Fundamentals Course</option>
                                <option value="react-mastery">React & Node mastery</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="url">Portfolio or GitHub URL</label>
                        <input type="url" id="url" name="url" placeholder="https://github.com/yourname">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="message">Why should we choose you?</label>
                    <textarea id="message" name="message" rows="5" placeholder="Tell us about your passion for code..." required></textarea>
                </div>

                <div class="form-group full-width">
                    <label for="resume">Upload CV (PDF only)</label>
                    <input type="file" id="resume" name="resume" accept=".pdf">
                </div>

                <div class="form-action">
                    <button type="submit" class="btn-black">Submit Application</button>
                </div>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Hot Beans Web</p>
    </footer>

</body>
</html>
